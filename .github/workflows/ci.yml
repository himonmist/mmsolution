name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: mm, POSTGRES_PASSWORD: mm_dev_pw, POSTGRES_DB: mmsolution_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mm:mm_dev_pw@localhost:5432/mmsolution_test?schema=public
      SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: |
          printf 'DATABASE_URL="%s"\nSITE_URL="http://localhost:3000"\nUPLOAD_DIR="./storage/test-uploads"\n' "$DATABASE_URL" > .env.test
          npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
