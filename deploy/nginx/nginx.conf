# Rate-limit zones (defence in depth; the app also rate-limits)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name example.com www.example.com;   # ← your domain

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;

  server_tokens off;
  client_max_body_size 10m;
  client_body_timeout 15s;
  client_header_timeout 15s;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # If behind Cloudflare, restore the real client IP (keep list current: https://www.cloudflare.com/ips/)
  # set_real_ip_from 173.245.48.0/20; ... real_ip_header CF-Connecting-IP;

  location ~ /\.(?!well-known) { deny all; }

  location /_next/static/ {
    proxy_pass http://app:3000;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://app:3000;
    include /etc/nginx/conf.d/proxy_params.inc;
  }

  location = /admin/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://app:3000;
    include /etc/nginx/conf.d/proxy_params.inc;
  }

  location / {
    proxy_pass http://app:3000;
    include /etc/nginx/conf.d/proxy_params.inc;
  }
}
