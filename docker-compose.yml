# Production-style stack: app + PostgreSQL + Nginx (TLS terminated at Nginx or Cloudflare).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mmsolution
      POSTGRES_USER: mm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mm -d mmsolution"], interval: 10s, retries: 5 }
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://mm:${POSTGRES_PASSWORD}@db:5432/mmsolution?schema=public
      SITE_URL: ${SITE_URL:?set SITE_URL}
      IP_HASH_SALT: ${IP_HASH_SALT:?set IP_HASH_SALT}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes: [uploads:/app/storage/uploads]
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy_params.inc:/etc/nginx/conf.d/proxy_params.inc:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks: [internal]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on: [db]
    environment: { PGPASSWORD: "${POSTGRES_PASSWORD}", RETENTION_DAYS: "14" }
    volumes: [./backups:/backups, ./deploy/scripts/backup.sh:/backup.sh:ro]
    entrypoint: ["/bin/sh", "-c", "while true; do /bin/sh /backup.sh; sleep 86400; done"]
    networks: [internal]

volumes: { pgdata: {}, uploads: {} }
networks: { internal: {} }
